services:
  backend:
    image: rust:1.83
    working_dir: /app
    volumes: ["./services/backend:/app"]
    command: cargo run --release -- --serve
    ports: ["8081:8081"]
  web:
    image: node:22
    working_dir: /app
    volumes: ["./apps/web:/app"]
    command: sh -c "npm install && npm run dev"
    environment:
      BACKEND_URL: http://backend:8081
    ports: ["3000:3000"]
    depends_on: [backend]
