[package]
name = "funkraum"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
rusqlite = { version = "=0.38.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
actix-web = "=4.13.0"
