<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fokus · Teamaufgaben</title><style>body{font:17px system-ui;background:#f3f6ee;color:#183b31;max-width:850px;margin:50px auto;padding:20px}header{border-bottom:3px solid #1d5844}form,article{display:flex;gap:12px;align-items:center;margin:20px 0;padding:18px;background:white;border-radius:12px}input,button,select{font:inherit;padding:10px;border:1px solid #a1b7a4;border-radius:6px}input{flex:1;min-width:0}button{cursor:pointer;background:#e6f2d7}article span{flex:1}article.done span{text-decoration:line-through;color:#607263}#search{width:100%;box-sizing:border-box}#status{min-height:25px}@media(max-width:600px){form,article{flex-wrap:wrap}body{margin:15px auto}}</style><header><h1>Fokus</h1><p>Teamaufgaben, Prioritäten und Fortschritt</p></header><form id="create"><input name="title" aria-label="Neue Aufgabe" placeholder="Was steht an?" maxlength="160" required><select name="priority" aria-label="Priorität"><option value="1">Hoch</option><option value="2" selected>Normal</option><option value="3">Später</option></select><button>Hinzufügen</button></form><input id="search" aria-label="Aufgaben filtern" placeholder="Aufgaben filtern"><p id="status" role="status"></p><p id="summary"></p><main id="tasks"></main><script>
let tasks=[];const status=document.querySelector('#status');async function call(path,method='GET',body){const r=await fetch('/api/tasks'+path,{method,...(body?{headers:{'content-type':'application/x-www-form-urlencoded','x-sample':'1'},body}:{headers:{'x-sample':'1'}})});const data=await r.json();if(!r.ok)throw Error(data.error||'Aktion fehlgeschlagen');return data;}async function load(){try{tasks=await call('');render();}catch(e){status.textContent=e.message;}}function render(){const target=document.querySelector('#tasks'),query=document.querySelector('#search').value.toLowerCase();target.replaceChildren();document.querySelector('#summary').textContent=tasks.filter(t=>t.done).length+' von '+tasks.length+' erledigt';for(const task of tasks.filter(t=>t.title.toLowerCase().includes(query)).sort((a,b)=>a.priority-b.priority||a.id-b.id)){const row=document.createElement('article');row.className=task.done?'done':'';const text=document.createElement('span');text.textContent=task.title+' · P'+task.priority;row.append(text);for(const [label,path,method]of [[task.done?'Wieder öffnen':'Erledigen','/'+task.id+'/toggle','POST'],['Entfernen','/'+task.id,'DELETE']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{await call(path,method);await load();}catch(e){status.textContent=e.message;}};row.append(b);}target.append(row);}}document.querySelector('#create').onsubmit=async e=>{e.preventDefault();try{await call('','POST',new URLSearchParams(new FormData(e.target)));e.target.reset();status.textContent='Aufgabe angelegt';await load();}catch(error){status.textContent=error.message;}};document.querySelector('#search').oninput=render;load();
</script></html>
