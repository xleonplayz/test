[package]
name = "dashboard-worker"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "=0.8.4", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "=1.45.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[profile.release]
strip = true
