[package]
name = "docs-indexer"
version = "1.0.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
axum = { version = "=0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "=1.45.1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
strip = true
